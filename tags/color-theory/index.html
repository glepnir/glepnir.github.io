00)}),e.parentNode.before(t)})}setTimeout(function(){addCopyButtonToCodeBlocks()},100)</script><script>window.store={"https://www.functor.me/":{title:"glepnir's blog",tags:[],content:"",url:"https://www.functor.me/"},"https://www.functor.me/posts/neovim-mcursor/":{title:"Neovim's New Multicursor Support",tags:[],content:`Multiple cursors landed in Neovim core on September 1. PR #41587. It ships in 0.13, so today you need nightly.
Q drops a cursor. 1Q drops one on every search match. &lt;C-l&gt; clears them. Everything you already know about Vim keeps working. That&rsquo;s most of it.
Reading the examples Every block below is the screen. Steps are separated by a line starting with - and the keys that got you there.
│ is a cursor, sitting just left of the character it&rsquo;s on, so │abc means the cursor is on the a. Past EOL it sits after the last character. Every cursor looks the same, including the one you&rsquo;re actually driving — Neovim calls that one the primary, and where the difference matters the note says so. Two cursors in the same cell draw one bar, same as the real thing.
[...] is a visual selection and ␣ is a space worth pointing at. Where a step&rsquo;s cursor positions don&rsquo;t matter, the screen just shows text.
How it works This isn&rsquo;t keystroke replay. Each action you take gets captured as an atom: the resolved, post-mapping key sequence for one semantic thing, the same material dot-repeat runs on. x is captured as dl. viweex is captured as viweed. Then every extra cursor replays that atom in its own context, which is why a visual sequence gets per-cursor extents instead of a fixed-size reselect.
A few things follow from that:
Cursors are extmarks in the nvim.multicursor namespace. That&rsquo;s the whole state. The primary cursor isn&rsquo;t one of them. Cursor sets are per-buffer, and a cascade only runs in the current buffer. Atoms replay at the completion of a toplevel normal command. A mapping still feeding keys pushes that back, so a mapping cascades as one unit. Insert mode previews at each cursor while you type instead of replaying at the end. Registers go per-cursor for the session, then join when it ends. One cascade is one undo state. Undo and redo never cascade. Cascade replays emit no CmdAtom. One action, one event, cursors or not. Keys Key Effect Q Toggle a cursor here. Ends follow-mode. [count]Q Cursor at every match of the last search pattern {Visual}Q Cursor on every selected line, by screen column. Starts follow-mode. &lt;C-LeftMouse&gt; Toggle a cursor at the click. Keeps follow-mode. q= Toggle follow-mode. 1q= on, 2q= off. ]C / [C Next / previous cursor, wraps, takes a count g&lt;C-a&gt; Ascending counter at each cursor &lt;C-l&gt; Clear cursors in the buffer gQ Restore the last cleared set &lt;C-c&gt; Interrupt a cascade Turn on showcmd and the count shows up there as 2×, or =2× in follow-mode.
Placing cursors Q The cursor starts at line 1 column 1 unless the keys say otherwise.
│aaa bbb ccc - Q nothing moves: the new cursor is exactly where you already are │aaa bbb ccc - j you move down, it doesn&#39;t │aaa │bbb ccc - Q again, no visible change until you move │aaa │bbb ccc - j │aaa │bbb │ccc - x your own edit runs first, then each cursor replays &#34;dl&#34; │aa │bb │cc It&rsquo;s a toggle. Press it on a cursor and that cursor goes away. Neither the drop nor the removal shows up on screen when you&rsquo;re standing on the spot, which is what the 2× in showcmd is for.
│aaa bbb - Q a cursor, right under you │aaa bbb - Q and gone again │aaa bbb - QjQk one on each line, then back up to line 1 │aaa │bbb - Q takes out the cursor under you. Still two bars: one of them is you. │aaa │bbb - x │aa │bb Take out the last one and the session ends. Same thing happens implicitly when a cursor is sitting where you are: the edit runs once and the pair merges.
│ab - Q a cursor, right under you │ab - x one deletion, not two, and no cursors left │b In operator-pending mode Q throws the operator away and places nothing.
│one two - dQ the d is gone, and no cursor either │one two - w so this is just a motion one │two - x one │wo You can&rsquo;t use it inside a macro, recording or executing. It just beeps.
qq Q q nothing placed (the Q still gets recorded) @q nothing placed Q works And watch out for qQ, which is q starting a recording into register Q.
[count]Q A cursor at every match of the last search pattern, including the one under the primary. The primary doesn&rsquo;t move.
│foo bar foo baz foo qux foobar foo - * whole-word search, primary jumps to the next match foo bar │foo baz foo qux foobar foo - 1Q a cursor at every match. &#34;foobar&#34; isn&#39;t a whole word, so it misses. │foo bar │foo baz │foo qux foobar │foo - cwXXX&lt;Esc&gt; the one you&#39;re standing on merges away, so nothing gets edited twice XX│X bar XX│X baz XX│X qux foobar XX│X Any search works, and several matches on one line are fine.
│ab ab ab xx ab - /ab&lt;CR&gt; ab │ab ab xx ab - 1Q │ab │ab │ab xx │ab - x │b │b │b xx │b Placement runs through the real search engine, so your case options behave exactly like they do for n.
:set ignorecase │Foo foo FOO - /foo&lt;CR&gt; Foo │foo FOO - 1Q all three │Foo │foo │FOO - gUiw FOO FOO FOO :set smartcase │Foo foo Foo - /Foo&lt;CR&gt; the capital F forces case-sensitivity Foo foo │Foo - 1Q only the two &#34;Foo&#34;s │Foo foo │Foo - x │oo foo │oo No previous search, no cursors (E35).
The two placement styles mix.
│foo bar foo - * foo bar │foo - 1Q │foo bar │foo - 0fb over to &#34;bar&#34; │foo │bar │foo - Q now &#34;bar&#34; is a cursor too, not just where you happen to be │foo │bar │foo - $ and you go edit a fourth position │foo │bar │fo│o - x │oo │ar │o {Visual}Q Visual mode ends, the primary lands on the first selected line, and every selected line gets a cursor at the primary&rsquo;s screen column. Follow-mode comes on.
│aaaa bbbb cc dddd - gg0ll aa│aa bbbb cc dddd - V2j [aaaa] [bbbb] [cc] dddd - Q you land on the first selected line, one cursor per line aa│aa bb│bb cc│ short line: the cursor sits past EOL dddd - iX&lt;Esc&gt; aa│Xaa bb│Xbb cc│X dddd Follow-mode is on, so the next motion takes everything with it.
- j aaXaa bb│Xbb cc│X dd│dd - x aaXaa bb│bb c│c dd│d Screen column, not byte column. A multibyte character earlier on one line won&rsquo;t throw off the cursors on the others.
│é123 abcdef - gg0ll two screen columns right, onto &#34;2&#34; é1│23 abcdef - vjQ é1│23 ab│cdef same screen column, different byte column - x é1│3 ab│def Mouse &lt;C-LeftMouse&gt; toggles a cursor where you click, without moving the primary or pulling you into another window.
│aaa bbb ccc - &lt;C-LeftMouse&gt; on line 3 │aaa bbb │ccc - x │aa bbb │cc - &lt;C-LeftMouse&gt; on line 3 again │aa bbb cc Unlike Q it leaves follow-mode alone, and it&rsquo;s a no-op in insert mode. Middle-click paste is still one paste at the click point.
:g and :cdo Q is a normal-mode command, so anything that runs normal-mode commands can place cursors.
│foo a bar b foo c baz d foo e - :g/foo/normal! Q a cursor per match, and :g leaves you on the last one │foo a bar b │foo c baz d │foo e - A!&lt;Esc&gt; foo a│! bar b foo c│! baz d foo e│! Put motions in front of the Q to pick the column.
:g/checkPassword/normal! 0fcQ cwverifyPassword&lt;Esc&gt; Quickfix works the same, except a range there addresses items, not lines.
qflist on lines 1, 2, 4 │aaa bbb ccc ddd - :cdo normal! Q │aaa │bbb ccc │ddd - 3G0 step off the last item, or it gets edited twice │aaa │bbb │ccc │ddd - x │aa │bb │cc │dd :2,3cdo normal! Q gives you 2 cursors, on items 2 and 3.
Lua nvim_mcursor(buf, {row, col}) takes a (1,0)-indexed position and hands back the number of extra cursors. Calling it on an existing cursor is a no-op, not a toggle. Hidden buffers are fine.
for _, m in ipairs(vim.fn.matchbufline(&#39;%&#39;, [[\\&lt;TODO\\&gt;]], 1, &#39;$&#39;)) do vim.api.nvim_mcursor(0, { m.lnum, m.byteidx }) end Bad input gets you Invalid cursor line: out of range, Invalid 'pos': expected [row, col] array, or Invalid buffer.
Clearing them &lt;C-l&gt; clears the buffer&rsquo;s cursors on top of its usual nohlsearch and diffupdate. It&rsquo;s a default mapping, so if you wrap it you need to remap, not feed it noremap.
Clearing takes a snapshot, and gQ brings it back, same idea as gv.
│aaa bbb ccc ddd - QjQ │aaa │bbb ccc ddd - &lt;C-l&gt; aaa │bbb ccc ddd - gQ │aaa │bbb ccc ddd - G │aaa │bbb ccc │ddd - x │aa │bb ccc │dd The snapshot rides on extmarks, so edits in between shift it.
│aa │bb ccc │dd - &lt;C-l&gt; aa bb ccc │dd - ggO&lt;Esc&gt; a new line on top │ aa bb ccc dd - gQ the restored cursors moved down with the text │ │aa │bb ccc dd :edit! takes out the cursors and the snapshot together. Clearing part of the namespace removes those cursors without ending the session, so the rest keep follow-mode and the registers don&rsquo;t join yet.
From Lua, clearing the namespace is the same operation, snapshot and all.
vim.api.nvim_buf_clear_namespace(0, vim.api.nvim_create_namespace(&#39;nvim.multicursor&#39;), 0, -1) &lt;C-c&gt; interrupts a cascade in flight. What got done is still one undo block and no line ends up half-edited. It doesn&rsquo;t clear anything.
Normal mode Operators QjQj │hello world │foo bar │one two - dw │world │bar │two QjQj │aaaa │bbbb │cccc - 2x │aa │bb │cc Q2jQ2j │a1 a2 │b1 b2 │c1 c2 - dd │a2 │b2 │c2 D and C, from column 2:
gg0ll Qj on│e two th│ree four - D o│n t│h gg0ll Qj on│e two th│ree four - CX&lt;Esc&gt; on│X th│X Qj │abcd │efgh - 2clXY&lt;Esc&gt; X│Ycd X│Ygh Qj │abc │def - ~~ toggle case, twice, advancing each time AB│c DE│f Backwards:
gg$ Qj$ x_abc│Y w_defg│Z - cT_M&lt;Esc&gt; x_│MY w_│MZ gg$ Qj$ abcde│f ghijk│l - d4h a│f g│l Counted objects:
Qj │one two three │foo bar baz - c2awX&lt;Esc&gt; │Xthree │Xbaz Objects that seek forward find their own target per cursor:
gg0l Qj a│()b c│()d - ci(X&lt;Esc&gt; a(│X)b c(│X)d Qj │x &#34;aa&#34; y │z &#34;bbb&#34; w - ci&#34;NEW&lt;Esc&gt; x &#34;NE│W&#34; y z &#34;NE│W&#34; w Operators that eat a payload character carry it along:
Qj │ab,cd │wxy,z - df, │cd │z Qj │abc │def - 2rZ Z│Zc Z│Zf Qj │abc │def - grZ │Zbc │Zef r&lt;CR&gt; terminates itself, no &lt;Esc&gt;:
gg0l Qj a│bcd e│fgh - r&lt;CR&gt; a │cd e │gh A search as the operator&rsquo;s motion travels with the atom, and each cursor finds its own match:
Qj │aaa find end │bbb find end - d/find&lt;CR&gt; │find end │find end Multibyte:
Qj │éàü │日本語 - x │àü │本語 Cursors end up wherever the operator left them, so the next key acts per region:
gg0l QjQj f│oo bar b│az qux a│aa bbb - diw each cursor is left where its word was │␣bar │␣qux │␣bbb - x │bar │qux │bbb gg0l Qj F│OO BAR B│AZ QUX - guiW cursor lands at the region start │foo BAR │baz QUX - x │oo BAR │az QUX Options apply per cursor:
:set autoindent Qj ␣␣│aaa ␣␣␣␣␣␣│bbb - ccX&lt;Esc&gt; each line keeps its own indent ␣␣│X ␣␣␣␣␣␣│X :set shiftwidth=2 Qj │foo │bar - &gt;&gt; ␣␣│foo ␣␣│bar &lt;C-a&gt; and &lt;C-x&gt; cascade like anything else:
Qj │x = 5 │y = 5 - &lt;C-x&gt; x = │4 y = │4 - &lt;C-a&gt; x = │5 y = │5 Chaining Positions update after each cascade, so you can just keep going.
QjQ │AAAA │BBBB CCCC - j │AAAA │BBBB │CCCC - x │AAA │BBB │CCC - x │AA │BB │CC Anything that inserts lines shifts the cursors below it, primary included:
QjQj │aaa │bbb │ccc - oX&lt;Esc&gt; aaa │X bbb │X ccc │X Typeahead behind the cascading key survives:
Qj │abc │def - xyy &#34;x&#34; cascades, the queued &#34;yy&#34; survives and cascades too │bc │ef - p each cursor pastes what it yanked bc │bc ef │ef Dot-repeat QjQj │aaa │bbb │ccc - x │aa │bb │cc - . │a │b │c An edit you made before placing cursors is still what . repeats:
│aaa bbb ccc - x │aa bbb ccc - QjQj │aa │bbb │ccc - . │a │bb │cc Inserts and changes repeat too:
Qj │aaa │bbb - iZ&lt;Esc&gt; │Zaaa │Zbbb - . │ZZaaa │ZZbbb Including across a follow-mode move:
Qj │one two │one two - cwX&lt;Esc&gt; │X two │X two - q= w q= every cursor onto its own second word X │two X │two - . X │X X │X Follow mode Off by default: only the primary moves.
│abcd efgh - Q │abcd efgh - j no cascade: you move, the cursor doesn&#39;t │abcd │efgh - q= ll now both move ab│cd ef│gh - x ab│d ef│h q= toggles it, and a count forces instead: 1q= always on, 2q= always off. Picking up where that left off:
ab│d ef│h - q= h off again, so only you move ab│d e│fh - x a│b e│h - 1q= 1q= h forced on, both move │ab │eh - x │b │h - 2q= 2q= forced off - A!&lt;Esc&gt; edits cascade either way b│! h│! - h b│! │h! - x │b │! $ sends each cursor to its own end of line:
Qj q= │abc │defgh - $ ab│c defg│h - x a│b def│g Vertical, display and arrow motions all follow:
Q 3j q= │a1 a2 a3 │b1 b2 b3 - j x a1 │2 a3 b1 │2 b3 - k x │1 2 a3 │1 2 b3 - gj x 1 │ a3 1 │ b3 - gk x both lines are empty now │ a3 │ b3 Each cursor keeps its own curswant over short lines:
gg04l Q 3jhh ABCD│EF xy GHIJKL MN│OPQR zw STUVWX - q= jj q= the short lines don&#39;t reset anybody&#39;s column ABCDEF xy GHIJ│KL MNOPQR zw ST│UVWX - x ABCDEF xy GHIJ│L MNOPQR zw ST│VWX Mapped and &lt;expr&gt;-mapped motions follow:
:nnoremap j gj Q2j q= │a1 a2 │b1 b2 - j a1 │a2 b1 │b2 - x a1 │2 b1 │2 A mapping that moves the cursor without pressing a motion key follows too, whether it gets there through the API, a nested :normal! inside &lt;Cmd&gt;, or a plain :call. Which means matchit&rsquo;s % works:
:packadd matchit QjQj q= │(aa) │(bb) │(cc) - % every cursor jumps to its own &#34;)&#34; (aa│) (bb│) (cc│) - x (a│a (b│b (c│c Jumps don&rsquo;t follow. &lt;C-o&gt; and \` move the primary alone. Scrolling never follows either way, so &lt;C-d&gt; is primary-only, and a later edit still cascades to the off-screen cursors while the viewport stays where it was.
Cursors that converge merge, and if they all merge the session ends and follow-mode resets:
QjQ q= │aaa │bbb ccc - G everybody lands on line 3 aaa bbb │ccc - x one deletion, not three aaa bbb │cc Q ends follow-mode. &lt;C-LeftMouse&gt; doesn&rsquo;t. ]C and [C don&rsquo;t drag the others.
q= while you&rsquo;re recording a macro won&rsquo;t toggle, because the q stops the recording first.
A mapping that edits cascades its motions too, even with follow-mode off:
:nnoremap gj i&lt;C-j&gt;&lt;Esc&gt;k$ gg04l QjQj aaa │bbb ccc │ddd eee │fff - gj split at the cursor, then k$ back to the end of the first half aaa│␣ bbb ccc│␣ ddd eee│␣ fff - x the k$ moved every cursor, so the trailing spaces go aa│a bbb cc│c ddd ee│e fff Same thing for a mapping that moves before it inserts:
:nnoremap i ^i gg0ll QjQj aa│aa bb│bb cc│cc - iX the ^ takes each cursor to its own first non-blank X│aaaa X│bbbb X│cccc - &lt;Esc&gt; │Xaaaa │Xbbbb │Xcccc Insert mode Text shows up at the other cursors as you type it, not at &lt;Esc&gt;.
QjQj │puts &#34;one&#34; │puts &#34;two&#34; │puts &#34;three&#34; - I# already there, still in insert mode #│puts &#34;one&#34; #│puts &#34;two&#34; #│puts &#34;three&#34; - ␣&lt;Esc&gt; # puts &#34;one&#34; # puts &#34;two&#34; # puts &#34;three&#34; Cursor moves inside the session cascade live and resolve per cursor:
QjQj │alpha one │beta two │gamma three - Aab still in insert mode alpha oneab│ beta twoab│ gamma threeab│ - &lt;Left&gt;&lt;Left&gt;X alpha oneX│ab beta twoX│ab gamma threeX│ab - &lt;Esc&gt; AZ&lt;Home&gt;Y&lt;Esc&gt; &lt;Home&gt; is each line&#39;s own start Yalpha oneXabZ Ybeta twoXabZ Ygamma threeXabZ - A&lt;S-Left&gt;W&lt;Esc&gt; word-wise, per cursor Yalpha WoneXabZ Ybeta WtwoXabZ Ygamma WthreeXabZ &lt;C-g&gt;U cascades and doesn&rsquo;t split undo:
Qj │aa │bb - i12&lt;C-g&gt;U&lt;Left&gt;3&lt;Esc&gt; 1│32aa 1│32bb - u one block, not two │aa │bb An absolute jump splits the session and re-anchors:
alpha beta gamma - j0Q j0Q gg$ alph│a │beta │gamma - ix alphx│a x│beta x│gamma - &lt;C-Home&gt;y the jump re-anchors, the previews stay y│alphxa xy│beta xy│gamma &lt;C-c&gt; ends the session like &lt;Esc&gt; does. The text and the cursors both survive.
Deleting:
Qj │aaa │bbb - iXY&lt;BS&gt;Z&lt;Esc&gt; X│Zaaa X│Zbbb gg0l Qj a│bc d│ef - i&lt;BS&gt;Z&lt;Esc&gt; &lt;BS&gt; eats past where the insert started │Zbc │Zef &lt;BS&gt; at column 0 joins with the line above:
ggj0 Q2j aa │bb cc │dd - i&lt;BS&gt;&lt;Esc&gt; a│abb c│cdd &lt;CR&gt; splits:
gg02l Qj aa│Xbb cc│Xdd - iAB&lt;CR&gt;CD&lt;Esc&gt; aaAB C│DXbb ccAB C│DXdd Entry commands:
Q2j │aaa bbb │ccc - OX&lt;Esc&gt; │X aaa bbb │X ccc Qj │abc │def - aZ&lt;Esc&gt; a│Zbc d│Zef gg$ Qj$ ␣␣a│a ␣␣␣␣b│b - IX&lt;Esc&gt; each line&#39;s own first non-blank ␣␣│Xaa ␣␣␣␣│Xbb Insert-mode commands:
Qj │zz │yy - ifoo bar&lt;C-w&gt;X&lt;Esc&gt; foo │Xzz foo │Xyy Qj │aaa │bbb - i&lt;C-v&gt;u00e9&lt;Esc&gt; │éaaa │ébbb Qj │aaa │bbb - 3iZ&lt;Esc&gt; ZZ│Zaaa ZZ│Zbbb Replace mode, including &lt;BS&gt; putting back what it overwrote:
Qj │abcdef │ghijkl - RXY&lt;Esc&gt; X│Ycdef X│Yijkl Qj │abcdef │ghijkl - RXY&lt;BS&gt;&lt;BS&gt;&lt;Esc&gt; the &lt;BS&gt;s put the overwritten chars back │abcdef │ghijkl Abbreviations and autoindent:
:iabbrev teh the Qj │aaa │bbb - iteh &lt;Esc&gt; the│ aaa the│ bbb :set autoindent Qj ␣␣│aa ␣␣␣␣␣␣│bb - oX&lt;Esc&gt; ␣␣aa ␣␣│X ␣␣␣␣␣␣bb ␣␣␣␣␣␣│X A replayed &lt;C-u&gt; on a less-indented line has nothing to eat, and won&rsquo;t backspace through the line boundary:
:set autoindent QjQj │␣␣␣␣indented aa │flat bb │␣␣␣␣indented cc - o&lt;C-u&gt;&lt;Tab&gt;yay&lt;Esc&gt; ␣␣␣␣indented aa →ya│y flat bb →ya│y ␣␣␣␣indented cc →ya│y ea under follow-mode:
Qj q= │one two │three four - ea!&lt;Esc&gt; one│! two three│! four Completion works. The cascade pauses while a popup is up and the other cursors catch up when it closes, so accepting a candidate lands everywhere:
│wombat wo wo - 2gg Q j a cursor on line 2, you on line 3 wombat │wo │wo - A&lt;C-n&gt;&lt;Esc&gt; the cursor catches up when the popup closes wombat womba│t womba│t Same for autocomplete and for a plugin driving complete() from an InsertCharPre handler.
Autocommand counts match what you&rsquo;d get with one cursor. InsertEnter and InsertLeave fire once. TextChangedI fires once per typed character, not once per cursor. TextChanged fires once for the session. InsertCharPre fires once per character, and whatever it does to v:char lands at every cursor. textwidth wraps per cursor.
Insertion points past EOL get drawn as virtual cells, so A at three cursors shows you three carets.
Visual mode Each cursor shows its own selection, previewed live, with the display cursor at each selection end. o swaps it to the other end. Charwise, linewise and blockwise all render.
The whole keysequence replays, so the extents are per-cursor:
Qj │one two three x │aa bb cc d - viw [one] two three x [aa] bb cc d - ee two more words, each cursor stretching over its own text [one two three] x [aa bb cc] d - x │␣x │␣d Qj │one two │ab cd - viw [one] two [ab] cd - rX │XXX two │XX cd Q4j │a b c d │e f - Vj [a] [b] c d [e] [f] - d │c │d Blockwise:
Q2j │ab cd │ef gh - &lt;C-v&gt;j [a]b [c]d [e]f [g]h - cX&lt;Esc&gt; │Xb Xd │Xf Xh Same block, I inserts before it and A appends after it:
[a]b [a]b [c]d [c]d [e]f [e]f [g]h [g]h - IX&lt;Esc&gt; - A!&lt;Esc&gt; │Xab │a!b Xcd c!d │Xef │e!f Xgh g!h Payload motions inside the selection:
Qj │abcd,ef │wxyz,gh - vf, [abcd,]ef [wxyz,]gh - d │ef │gh Qj │one two │one two - v/two&lt;CR&gt; [one t]wo [one t]wo - d │wo │wo &lt;Esc&gt; puts every cursor on its own selection end, which is a handy way to reposition without turning on follow-mode:
gg04l QjQj aaa │bbb ccc ddd │eee fff ggg │hhh iii - viw aaa [bbb] ccc ddd [eee] fff ggg [hhh] iii - &lt;Esc&gt; every cursor lands on its own selection end aaa bb│b ccc ddd ee│e fff ggg hh│h iii - x the column doesn&#39;t move, so every cursor is now on a space aaa bb│␣ccc ddd ee│␣fff ggg hh│␣iii Again from column 0, this time stretching one word further. The 0 is primary-only, the viwe replays everywhere:
- 0 aaa bb│␣ccc ddd ee│␣fff │ggg hh iii - viwe &#34;iw&#34; on a space is the space, then &#34;e&#34; takes the next word aaa bb[␣ccc] ddd ee[␣fff] [ggg hh] iii - &lt;Esc&gt;x aaa bb c│c ddd ee f│f ggg h│␣iii A selection changed by scrolling the viewport (V&lt;C-e&gt; at the window edge) isn&rsquo;t replayable, so it edits the primary only.
Registers Every cursor reads and writes its own.
Qj │aaa │bbb - yy buffer unchanged, two yanks into two registers - p aaa │aaa bbb │bbb Swap two words everywhere:
Qj q= │one two │three four - dW each cursor&#39;s first word into its own register │two │four - E to the end of what&#39;s left tw│o fou│r - p charwise paste leaves each cursor on the last pasted char twoone│␣ fourthree│␣ Paste each cursor&rsquo;s own yank over its own word:
Qj │aaa X │bbb Y - yiw - q= w q= aaa │X bbb │Y - viwp aaa aa│a bbb bb│b Jagged line ends, each cursor on its own register:
gg$Q j$ ab│c d│e - x a│b │d - p ab│c d│e Once the last cursor goes, the per-cursor values join in document order, linewise:
Qj0Q j0 │foo x │bar y │baz z - yiw buffer unchanged; &#34; is &#34;baz&#34; while the session is alive - &lt;C-l&gt; &#34; is now foo\\nbar\\nbaz\\n , type V Named registers join the same way, and one nobody touched is left alone:
:let @z = &#39;PRESET&#39; Qj0 │foo │bar - &#34;ayiw then &lt;C-l&gt; @a -&gt; foo\\nbar\\n @z -&gt; PRESET Last write wins:
Qj0 │aa │bb - yl then x then &lt;C-l&gt; @&#34; is a\\nb\\n the deletes, not the yanks A cursor whose replays never wrote a register contributes nothing, instead of folding in the stale pre-session value.
TextYankPost fires per cursor with that cursor&rsquo;s contents. The primary fires first and isn&rsquo;t a replay, which nvim__mcursor_cascading() will tell you. The primary&rsquo;s registers are the ones that stick.
Under clipboard=unnamedplus the provider syncs once for the primary&rsquo;s own edit and once for the whole cascade, not once per cursor, and what reaches the clipboard is the primary&rsquo;s.
Undo One u reverts a whole cascade. Undo and redo don&rsquo;t land in the same place though: undo sends you back to where the change started, redo puts every cursor back where the edit left it, rather than wherever splice adjustment would have drifted it.
QjQj$ │aaa │bbb cc│c - IX &lt;Esc&gt; cursors at column 1, on the space X│ aaa X│ bbb X│ ccc - u text back. The cursors go to column 0, you go back to where you were standing when you started the change. │aaa │bbb cc│c - &lt;C-r&gt; now everybody&#39;s at column 1, not column 2 X│ aaa X│ bbb X│ ccc - x X│aaa X│bbb X│ccc Each cascade is a step, and a count counts cascades:
Q │abc def - jx │bc │ef - x │c │f - u │bc │ef - u │abc │def - &lt;C-r&gt;&lt;C-r&gt; │c │f - 2u │abc │def Q is placement, not an edit, so the tree runs straight through the point where you placed cursors:
│xxx yyy - x │xx yyy - Q j x │x │yy - u │xx │yyy - u the restored &#34;x&#34; is inserted in front of the cursor, pushing it │x│xx yyy A cascaded macro is one block:
:let @q = &#34;iX\\&lt;Esc&gt;&#34; Qj │aaa │bbb - @q │Xaaa │Xbbb - u │aaa │bbb - &lt;C-r&gt; │Xaaa │Xbbb A mapped undo or redo doesn&rsquo;t cascade. Undo is buffer-global, so cascading it would undo once per cursor and blow straight past the start of the session:
:nnoremap &lt;silent&gt; u :&lt;C-u&gt;undo&lt;CR&gt; QjQj │aaa │bbb │ccc - x │aa │bb │cc - u one undo, not three │aaa │bbb │ccc Undo restores text, never registers. The per-cursor values survive it, so exiting still joins them:
Qj0 │foo x │bar y - diw │␣x │␣y - u text back, registers untouched: @&#34; is still &#34;bar&#34; │foo x │bar y - &lt;C-l&gt; @&#34; is foo\\nbar\\n g-, g+ and :earlier drop every cursor and end the session:
Q │aaa bbb - jx │aa │bb - g- every cursor is dropped; the bar left is just you aaa │bbb - g+ still none aa │bb - Q new session, cursor where you are aa │bb Macros @ cascades:
gg0qqxq record &#34;x&#34; into q; line 1 becomes &#34;aa&#34; │aa bbb ccc - jQ j0 aa │bbb │ccc - @q aa │bb │cc - @@ aa │b │c So does a macro with an insert session in it:
gg0qwA!&lt;Esc&gt;q aaa│! bbb ccc - jQ j0 aaa! │bbb │ccc - @w aaa! │bbb! │ccc! A count applies at each cursor:
aaaa │bbbb │cccc - 2@q the &#34;x&#34; macro, twice per cursor aaaa │bb │cc A macro typed where there are no cursors cascades in whatever buffer it navigates into, same as a mapping.
Numbering Qj0Qj0 │a │b │c - g&lt;C-a&gt; 1│a 2│b 3│c Qj0 │a │b - 5g&lt;C-a&gt; 5│a 6│b One bar, one number. Two cursors stacked in the same cell still only get one:
QjQj gg0 back to line 1, where a cursor already is │x │y z - g&lt;C-a&gt; two bars on screen, two numbers 1│x 2│y z The number goes in at the cursor&rsquo;s column, before whatever is there:
Qj x = │5 y = │5 - g&lt;C-a&gt; x = 1│5 y = 2│5 Through a mapping it applies once, not once per cursor:
:nnoremap ,n g&lt;C-a&gt; QjQj │a │b │c - ,n 1│a 2│b 3│c With no cursors it isn&rsquo;t a command and beeps. Plain &lt;C-a&gt; still increments.
Start, step and format live on the function behind it. Private module, so pin your version or wrap it in pcall:
require(&#39;vim._core.mcursor&#39;).number(10, 2, &#39;%d) &#39;) Qj0Qj0 │x │x │x - the call above 10) │x 12) │x 14) │x Jumping between cursors ]C and [C cycle in position order, wrapping, with a count. They&rsquo;ll scroll the viewport to reach an off-screen cursor, and they never drag the other cursors along, even in follow-mode. The jump leaves a cursor at the position you left, so walking the ring doesn&rsquo;t change the set of positions. No cursors, no move, just a beep.
Q2jllQ gg0j │aaa │bbb you&#39;re here cc│c ddd - ]C -&gt; line 3, column 2. A cursor stays behind on line 2, so the screen doesn&#39;t change. │aaa │bbb cc│c ddd - ]C -&gt; line 1, column 0, wrapped - 2]C -&gt; line 3, column 2 - [C -&gt; line 2, column 0 - [C -&gt; line 1, column 0 - x three positions, three edits │aa │bb c│c ddd Pair that with the Q toggle and you get select-all-then-deselect:
1Q every match ]C ]C walk Q drop this one ciw... edit the rest Folds The primary keeps normal fold behavior. Replays don&rsquo;t: they act on the per-cursor line inside the fold, and the fold stays closed.
Primary outside the fold:
3G0Q then :2,4fold then gg0 │aaa +-- 3 lines: bbb············· lines 2-4, the cursor is on line 3 - x │aa +-- 3 lines: bbb············· - dd primary deletes line 1; the cursor deletes only line 3 +-- 2 lines: bbb············· what&#39;s left is bbb and ddd Primary inside the fold:
4jQ then gg then :2,3fold then 2G aaa +-- 2 lines: bbb············· you&#39;re in here ddd │eee fff - dd you take the whole fold, the cursor takes only its own line aaa │ddd │fff Follow-mode motions ignore closed folds too, so a replayed j steps into one. A mapping that turns fold semantics back on mid-cascade (zN then dd) doesn&rsquo;t change that.
Fold operators cascade; fold toggles don&rsquo;t:
4G0Q gg0 zfap each cursor folds its own paragraph za only the primary&#39;s fold toggles What doesn&rsquo;t cascade Ex commands. The atom gets emitted with type = &quot;excmd&quot; and never replayed:
Qj │foo │foo - :s/o/O/&lt;CR&gt; only your line foo │fOo :normal!, and anything else programmatic:
Qj │aaa │bbb - :normal! x primary only │aaa │bb - x typed, so it cascades │aa │b API edits shift the cursors but are primary-only themselves:
QjQj │aaa │bbb │ccc - :lua vim.api.nvim_buf_set_lines(0, 0, 0, true, { &#39;zzz&#39; }) zzz │aaa │bbb │ccc - x zzz │aa │bb │cc Also undo and redo, fold toggles, an operator with no effect (an aborted ysa[ won&rsquo;t drag every cursor onto the same bracket), and an atom captured in one buffer that resolves in another (a mapping ending in :bnext doesn&rsquo;t cascade into where it lands).
Buffers Cursor sets are per-buffer. A cascade pauses while you&rsquo;re elsewhere and picks up when you come back:
:set hidden Qj │aaa │bbb - :enew gg0x a different buffer, no cascade into the old one │xx - :buffer # the cursor was an extmark, it survived │aaa │bbb - 2G0x │aa │bb Edits cascade from any window showing the buffer, so :split and editing from the new window is fine. Cursors die with their buffer, and nvim_mcursor() will happily place them in a hidden one.
Advanced Occurrence operator This is the thing issue #21334 was asking for. An operatorfunc puts a cursor on every occurrence of the word under the cursor within a motion, then your next edit cascades to all of them. They survive because a g@ with no effect doesn&rsquo;t cascade.
_G.occur_opfunc = function() local ms = vim.fn.matchbufline(&#39;%&#39;, _G.occur_pat, vim.fn.line(&#34;&#39;[&#34;), vim.fn.line(&#34;&#39;]&#34;)) vim.api.nvim_win_set_cursor(0, { ms[1].lnum, ms[1].byteidx }) for i = 2, #ms do vim.api.nvim_mcursor(0, { ms[i].lnum, ms[i].byteidx }) end end vim.keymap.set(&#39;n&#39;, &#39;co&#39;, function() _G.occur_pat = ([[\\&lt;%s\\&gt;]]):format(vim.fn.expand(&#39;&lt;cword&gt;&#39;)) vim.o.operatorfunc = &#39;v:lua.occur_opfunc&#39; return &#39;g@&#39; end, { expr = true }) │text a text b text c - coip a cursor on every &#34;text&#34; in the paragraph │text a │text b │text c - ciwWORD&lt;Esc&gt; WOR│D a WOR│D b WOR│D c coi{, coap and co3j all work the same way.
Follow mode for exactly one motion CmdAtom plus a one-shot autocommand. Returning true deletes the autocommand.
vim.keymap.set(&#39;n&#39;, &#39;q-&#39;, function() vim.cmd(&#39;normal! 1q=&#39;) vim.api.nvim_create_autocmd(&#39;CmdAtom&#39;, { callback = function(ev) if ev.data.lhs == &#39;q-&#39; then return end vim.cmd(&#39;normal! 2q=&#39;) return true end, }) end) QjQj │␣␣aaa │␣␣bbb │␣␣ccc - q- ^ every cursor to its first non-blank ␣␣│aaa ␣␣│bbb ␣␣│ccc - l follow mode already ended, so only you move ␣␣│aaa ␣␣│bbb ␣␣c│cc Telling the primary apart in an autocommand vim.api.nvim_create_autocmd(&#39;TextYankPost&#39;, { callback = function() if vim.api.nvim__mcursor_cascading() then return end -- primary only end, }) Double underscore, so it can change under you.
Cursors from a treesitter query local function cursors_from_query(lang, query_str, capture) local parser = vim.treesitter.get_parser(0, lang) local root = parser:parse()[1]:root() local query = vim.treesitter.query.parse(lang, query_str) for id, node in query:iter_captures(root, 0, 0, -1) do if query.captures[id] == capture then local row, col = node:range() vim.api.nvim_mcursor(0, { row + 1, col }) end end end cursors_from_query(&#39;lua&#39;, &#39;(function_declaration name: (identifier) @name)&#39;, &#39;name&#39;) A cursor on every function name, then cw to rename the lot.
Pruning Deleting an extmark deletes the cursor, so you can place broadly and filter after:
local ns = vim.api.nvim_create_namespace(&#39;nvim.multicursor&#39;) local function keep_cursors(pred) for _, m in ipairs(vim.api.nvim_buf_get_extmarks(0, ns, 0, -1, {})) do local id, row, col = m[1], m[2], m[3] local line = vim.api.nvim_buf_get_lines(0, row, row + 1, true)[1] if not pred(line, row + 1, col) then vim.api.nvim_buf_del_extmark(0, ns, id) end end end keep_cursors(function(line) return not line:match(&#39;^%s*//&#39;) end) Aligning columns Extmarks move with inserted text, so padding to a shared virtual column is short. Assumes one cursor per line, and skips the primary since it isn&rsquo;t an extmark.
local function align_cursors() local marks = vim.api.nvim_buf_get_extmarks(0, ns, 0, -1, {}) local target = 0 for _, m in ipairs(marks) do target = math.max(target, vim.fn.virtcol({ m[2] + 1, m[3] + 1 })) end for i = #marks, 1, -1 do local row, col = marks[i][2], marks[i][3] local pad = target - vim.fn.virtcol({ row + 1, col + 1 }) if pad &gt; 0 then vim.api.nvim_buf_set_text(0, row, col, row, col, { (&#39; &#39;):rep(pad) }) end end end Cursors from quickfix, across files for _, item in ipairs(vim.fn.getqflist()) do if item.valid == 1 and item.bufnr ~= 0 then vim.api.nvim_mcursor(item.bufnr, { item.lnum, math.max(item.col - 1, 0) }) end end Quickfix items are 1-indexed on both axes, hence col - 1. Diagnostics are 0-indexed on both, so those want lnum + 1 and a bare col.
CmdAtom One event per action, and cascade replays emit nothing.
type is motion, operator, insert, visual, mapping or excmd. lhs is what you typed before resolution. keys is the resolved sequence in raw bytes: empty means it can&rsquo;t be replayed, nil means the capture was lossy and you should replay lhs with feedkeys mode m instead of n. text carries the payload, whether that&rsquo;s inserted text, a cmdline or a search. changed and moved tell you whether the action edited or moved. atoms holds ordered subatoms, and it&rsquo;s only non-empty for a composite action.
nnoremap gj i&lt;C-j&gt;&lt;Esc&gt;k$ emits one mapping atom whose atoms are two inserts plus the motions k and $. q= gets recorded too, so a follow-mode stretch shows up as q=, l, l, q=.
The event is deferred, so schedule anything that reacts to it. A custom .:
local last ---@type vim.event.cmdatom.data? local mc = vim.api.nvim_create_namespace(&#39;nvim.multicursor&#39;) vim.api.nvim_create_autocmd(&#39;CmdAtom&#39;, { callback = function(ev) if ev.data.changed and ev.data.lhs ~= &#39;.&#39; then last = ev.data end end, }) vim.keymap.set(&#39;n&#39;, &#39;.&#39;, function() if #vim.api.nvim_buf_get_extmarks(0, mc, 0, -1, { limit = 1 }) &gt; 0 then vim.api.nvim_feedkeys(&#39;.&#39;, &#39;n&#39;, false) -- hand it back so it cascades return end vim.schedule(function() if last then vim.api.nvim_feedkeys(last.keys or last.lhs, last.keys and &#39;n&#39; or &#39;m&#39;, false) end end) end) That multicursor check is the important bit: a replay through feedkeys is programmatic and won&rsquo;t cascade. The version in :h CmdAtom also filters undo and redo out by comparing undoseq against a buffer-local high-water mark. :h cmdatom-macro keeps a ring of the last N atoms and turns them into an editable macro in the cmdwin.
Keymaps Q used to replay the last recorded register, and {Visual}Q ran it per selected line. Both are gone. If you miss them:
vim.keymap.set({ &#39;n&#39;, &#39;x&#39; }, &#39;&lt;leader&gt;q&#39;, &#39;Q&#39;, { remap = false }) vim.keymap.set(&#39;n&#39;, &#39;Q&#39;, function() local reg = vim.fn.reg_recorded() if reg == &#39;&#39; then return &#39;&#39; end return &#39;@&#39; .. reg end, { expr = true }) remap = false is what gets you the builtin Q instead of the mapping below it.
Cursor at every occurrence of the word under the cursor:
vim.keymap.set(&#39;n&#39;, &#39;&lt;leader&gt;*&#39;, function() local word = vim.fn.expand(&#39;&lt;cword&gt;&#39;) if word == &#39;&#39; then return end vim.fn.setreg(&#39;/&#39;, [[\\&lt;]] .. vim.fn.escape(word, [[\\/]]) .. [[\\&gt;]]) vim.v.hlsearch = 1 vim.cmd(&#39;normal! 1Q&#39;) end) :Cursors {pattern}, range-aware:
vim.api.nvim_create_user_command(&#39;Cursors&#39;, function(opts) local first = opts.range &gt; 0 and opts.line1 or 1 local last = opts.range &gt; 0 and opts.line2 or vim.fn.line(&#39;$&#39;) for _, m in ipairs(vim.fn.matchbufline(&#39;%&#39;, opts.args, first, last)) do vim.api.nvim_mcursor(0, { m.lnum, m.byteidx }) end end, { nargs = 1, range = true }) :Cursors \\d\\+ hits every number, :'&lt;,'&gt;Cursors , every comma in the selection.
Cursor on every error:
vim.keymap.set(&#39;n&#39;, &#39;&lt;leader&gt;me&#39;, function() for _, d in ipairs(vim.diagnostic.get(0, { severity = vim.diagnostic.severity.ERROR })) do vim.api.nvim_mcursor(0, { d.lnum + 1, d.col }) end end) Escape clears cursors when there are any. Clear the namespace directly rather than feeding &lt;C-l&gt;, which is a mapping and would need remap = true to fire:
vim.keymap.set(&#39;n&#39;, &#39;&lt;Esc&gt;&#39;, function() local n = #vim.api.nvim_buf_get_extmarks(0, ns, 0, -1, { limit = 1 }) if n &gt; 0 then vim.api.nvim_buf_clear_namespace(0, ns, 0, -1) -- snapshots for gQ, same as CTRL-L else vim.cmd(&#39;nohlsearch&#39;) end end) Colors:
vim.api.nvim_set_hl(0, &#39;MCursor&#39;, { reverse = true }) vim.api.nvim_set_hl(0, &#39;MCursorVisual&#39;, { link = &#39;Visual&#39; }) reverse is the safe pick. Linking to Cursor sounds right until you remember how many colorschemes leave Cursor invisible in the terminal.
If you share a config with a machine still on 0.12:
if vim.api.nvim_mcursor then -- ... end Things that will bite you Two cursors on one line do edit at their own columns, for column-local operators:
Q4l │abcd│ef - x you delete the &#34;e&#34;, then the cursor deletes the &#34;a&#34; │bcd│f - x │c│d But an edit that shifts columns shifts them relative to each other, and linewise operators aren&rsquo;t deduplicated for same-line cursors yet, so dd there runs once per cursor.
The rest of the list:
g-, g+ and :earlier end the session, and gQ can&rsquo;t bring the cursors back. :e! and autoread reloads clear the cursors and the gQ snapshot. Undo restores text, not registers. g&lt;C-a&gt; inserts before the character at the cursor&rsquo;s column, and $ stops on the last character, so appending numbers to line ends needs nvim_mcursor() at an exact byte column. Q is quietly unavailable inside a macro, and qQ starts a recording. iw and cw are still word objects. They won&rsquo;t split camelCase. Use :%s///g for substrings. Ex commands don&rsquo;t cascade. Terminals Nvim asks for the Kitty multiple-cursors protocol at startup and only uses it if the reply advertises cursor shape 29. When it does, you get real terminal cursors instead of MCursor cell highlights, including in unfocused splits. To force the fallback:
require(&#39;vim._core.mcursor&#39;).tty_cursors(false) `,url:"https://www.functor.me/posts/neovim-mcursor/"},"https://www.functor.me/posts/":{title:"Posts",tags:[],content:"",url:"https://www.functor.me/posts/"},"https://www.functor.me/posts/a-better-indent-line-implementation/":{title:"A Better Indent Line Implementation",tags:[],content:`I Built Another Indent Guide So I made indentmini.nvim a while back. Minimal indent guide plugin, pretty fast, people seem to like it. It works by using nvim_set_decoration_provider to draw virtual text on every visible line during each redraw cycle. I spent a ton of time optimizing it — bit-packing line data into integers, calling Neovim&rsquo;s C functions through FFI, all that fun stuff.
But the whole time there was this thing nagging me. Neovim already has leadmultispace in listchars. You set it to something like ┆··· (guide char
spaces) and Neovim renders indent guides on every line that has leading whitespace. For free. At the C level. No plugin needed. The only thing it can&rsquo;t do is blank lines. Blank lines have no text, so there&rsquo;s no leading whitespace to replace. And that&rsquo;s literally the only gap.
So I thought — what if the plugin just&hellip; handled blank lines? And nothing else?
How It Works Non-blank lines: One autocmd sets leadmultispace when a buffer is opened or shiftwidth changes. Done. The plugin never touches these lines again.
local function guides(bufnr) if vim.list_contains(opt.exclude_filetype, vim.bo.filetype) then return end local sw = get_step(bufnr) local indent_char = opt.char .. (&#39; &#39;):rep(sw - 1) vim.opt_local.listchars:append({ leadmultispace = indent_char }) end Blank lines: A decoration provider runs on_win to figure out what indent each blank line should have, then on_line draws the guides with ephemeral extmarks.
That&rsquo;s the whole plugin. Non-blank lines are Neovim&rsquo;s problem. Blank lines are mine.
Figuring Out Blank Line Indents This is the only interesting part. A blank line has no text, so you have to figure out its indent from surrounding context. Two approaches depending on what&rsquo;s available.
If TreeSitter is active, just ask the syntax tree. Get the node at the blank line, walk up to its parent, grab the parent&rsquo;s indent and add one level:
local node = ts.get_node({ bufnr = bufnr, pos = { row, 0 } }) local parent = node:parent() local p_srow = parent:range() indent = buf_get_indent(bufnr, p_srow + 1) + step If there&rsquo;s no TreeSitter, search up and down for the nearest non-blank lines and take the max:
local up = search_nearest(c, row - 1, UP, bufnr) local down = search_nearest(c, row + 1, DOWN, bufnr) indent = math.max(up, down) Why max? Picture this:
if (true) { // indent 4 // blank — up=4, down=8 foo(); // indent 8 } The blank line is inside the block, so it should show guides up to the deeper level. Max gets that right.
The search function handles both directions with a single implementation — just pass -1 or 1. And there&rsquo;s a nonblank cache so every line&rsquo;s indent gets computed at most once. First pass through the viewport caches all non-blank line indents. When searching for blank line context, the lookup hits the cache and returns immediately. Even lines outside the viewport get cached on first access so adjacent blank lines don&rsquo;t repeat the work.
local function search_nearest(c, row, direction, bufnr) local r = row while r &gt;= 0 and r &lt; c.count do if c.nonblank[r] then return c.nonblank[r] end local text = buf_get_line(bufnr, r) if not is_blank(text) then local indent = buf_get_indent(bufnr, r + 1) c.nonblank[r] = indent return indent end r = r + direction end return 0 end Rendering Blank Lines The on_line callback is short. Non-blank line? Return immediately. Blank line? Read the precomputed indent, loop through levels, place extmarks:
on_line = function(_, winid, bufnr, row) local c = ctx[winid] if not c or not c.blank[row] then return end local indent = c.indent[row] if not indent or indent &lt;= 0 then return end for level = opt.minlevel, math.floor(indent / step) do local col = (level - 1) * step api.nvim_buf_set_extmark(bufnr, ns, row, 0, { virt_text = { { opt.char, opt.hl } }, virt_text_pos = &#39;overlay&#39;, ephemeral = true, virt_text_win_col = col - c.leftcol, }) end end Since blank lines have zero length, you can&rsquo;t use column offsets — virt_text_win_col positions the guide visually. Subtracting leftcol handles horizontal scrolling.
FFI I use LuaJIT FFI to call Neovim internals directly — ml_get_buf for line text, get_sw_value for shiftwidth. Way faster than the Lua API for hot paths. Used get_indent_buf for computing indentation to support multiple windows.
indentmini vs This indentmini renders every line — it uses a snapshot system with bit-packed data, handles all the edge cases around mixed tabs/spaces, supports only_current mode for highlighting just the current block, all that. It&rsquo;s a proper plugin.
This new thing is more of an experiment. Push as much as possible onto Neovim&rsquo;s native rendering and only fill in the gap. Less code, less work per redraw, but also fewer features. Different tradeoffs.
The code is up on GitHub if you want to poke at it.
`,url:"https://www.functor.me/posts/a-better-indent-line-implementation/"},"https://www.functor.me/posts/thought_fp/":{title:"When Loops Become Math: How Functional Thinking Changed My C++",tags:[],content:`Last week, I was staring at two pieces of code a friend had sent me, asking which one I preferred. They looked like this:
// Version A double calculate_mean(const vector&lt;double&gt;&amp; data) { double sum = 0.0; for (const auto&amp; x : data) { sum += x; } return sum / data.size(); } // Version B double calculate_stddev(const vector&lt;double&gt;&amp; data) { double sum = 0.0; double mean = calculate_mean(data); for (const auto&amp; x : data) { sum += (x - mean) * (x - mean); } return sqrt(sum / data.size()); } I looked at them for a solid five seconds before it hit me: these two loops were fundamentally the same mathematical pattern! But in the code, that pattern was buried under for loops and accumulation variables.
Seeing with Math Eyes In math, we&rsquo;d write these calculations as:
mean=1n∑i=1nxi \\text{mean} = \\frac{1}{n} \\sum_{i=1}^n x_i mean=n1​i=1∑n​xi​stddev=1n∑i=1n(xi−μ)2 \\text{stddev} = \\sqrt{\\frac{1}{n} \\sum_{i=1}^n (x_i - \\mu)^2} stddev=n1​i=1∑n​(xi​−μ)2​See that $\\sum$ symbol? That&rsquo;s our abstraction point. In functional programming, this is called a fold (or reduce), defined as:
fold(f,z,[x1,x2,...,xn])=f(f(f(z,x1),x2),...,xn) \\text{fold}(f, z, [x_1, x_2, ..., x_n]) = f(f(f(z, x_1), x_2), ..., x_n) fold(f,z,[x1​,x2​,...,xn​])=f(f(f(z,x1​),x2​),...,xn​)Looking at my code with this new perspective:
template&lt;typename T, typename BinaryOp&gt; T fold(const vector&lt;T&gt;&amp; vec, T init, BinaryOp op) { T result = init; for (const auto&amp; x : vec) { result = op(result, x); } return result; } Now both calculations become:
double mean = fold(data, 0.0, plus&lt;double&gt;{}) / data.size(); double variance = fold(data, 0.0, [mean](double acc, double x) { return acc + (x - mean) * (x - mean); }) / data.size(); The Real Breakthrough: Seeing Deeper Patterns I started noticing this pattern everywhere. Take this convex hull algorithm I&rsquo;d written:
vector&lt;Point&gt; find_convex_hull(const vector&lt;Point&gt;&amp; points) { vector&lt;Point&gt; hull; for (size_t i = 0; i &lt; points.size(); ++i) { for (size_t j = 0; j &lt; points.size(); ++j) { if (i == j) continue; bool all_on_same_side = true; for (size_t k = 0; k &lt; points.size(); ++k) { if (k == i || k == j) continue; if (!is_on_same_side(points[i], points[j], points[k])) { all_on_same_side = false; break; } } if (all_on_same_side) { hull.push_back(points[i]); hull.push_back(points[j]); } } } return remove_duplicates(hull); } Three nested loops! But with functional thinking, I saw predicate logic:
A point pair (i,j) belongs to the convex hull boundary if and only if all other points are on the same side of the line segment (i,j).
Mathematically: (i,j)∈hull ⟺ ∀k≠i,j:same_side(i,j,k) (i,j) \\in \\text{hull} \\iff \\forall k \\neq i,j : \\text{same\\_side}(i,j,k) (i,j)∈hull⟺∀k=i,j:same_side(i,j,k)In C++, this becomes:
vector&lt;Point&gt; find_convex_hull_fp(const vector&lt;Point&gt;&amp; points) { auto pairs = cartesian_product(points, points); auto is_hull_edge = [&amp;](const pair&lt;Point, Point&gt;&amp; edge) { return all_of(points.begin(), points.end(), [&amp;](const Point&amp; p) { return &amp;p == &amp;edge.first || &amp;p == &amp;edge.second || is_on_same_side(edge.first, edge.second, p); }); }; return filter(pairs, is_hull_edge) | transform([](auto&amp;&amp; p) { return vector{p.first, p.second}; }) | flatten() | unique(); } Why This Matters: You Can Actually Prove Things Here&rsquo;s the cool part: functional code is easier to reason about.
With the original code, proving correctness meant:
Tracking three loop variables Understanding when the break happens Verifying when hull gets updated With the functional version:
cartesian_product generates all point pairs (obvious) is_hull_edge is a direct translation of the mathematical definition The composition uses standard, well-understood operations I can even write tests that verify mathematical properties:
// Convex hull property: all points should be inside the hull TEST(ConvexHull, AllPointsInsideHull) { auto points = generate_random_points(100); auto hull = find_convex_hull_fp(points); for (const auto&amp; p : points) { ASSERT_TRUE(is_point_inside_convex_polygon(p, hull)); } } Category Theory Sneaks In Recently, I was writing a config parser with multiple operations that could fail:
optional&lt;int&gt; parse_timeout(const string&amp; str); optional&lt;string&gt; parse_hostname(const string&amp; str); optional&lt;Config&gt; create_config(int timeout, const string&amp; host); The traditional way:
optional&lt;Config&gt; parse_config(const string&amp; timeout_str, const string&amp; host_str) { auto timeout = parse_timeout(timeout_str); if (!timeout) return nullopt; auto host = parse_hostname(host_str); if (!host) return nullopt; return create_config(*timeout, *host); } The functional way uses a pattern (some people call it a monad, but I just call it useful):
template&lt;typename T, typename Func&gt; auto and_then(const optional&lt;T&gt;&amp; opt, Func f) -&gt; decltype(f(opt.value())) { if (!opt) return decltype(f(opt.value()))(); return f(*opt); } optional&lt;Config&gt; parse_config_fp(const string&amp; timeout_str, const string&amp; host_str) { return and_then(parse_timeout(timeout_str), [&amp;](int timeout) { return and_then(parse_hostname(host_str), [&amp;](const string&amp; host) { return create_config(timeout, host); }); }); } Mathematically, this is composition in the Kleisli category: f:A→M(B),g:B→M(C)g∘Kf:A→M(C) f: A \\to M(B), \\quad g: B \\to M(C) \\\\ g \\circ_K f: A \\to M(C) f:A→M(B),g:B→M(C)g∘K​f:A→M(C)Performance? Actually Better People say functional code is slow. Modern C++ compilers are smart:
// Hand-written &#34;optimized&#34; version double sum_squares(const vector&lt;double&gt;&amp; data) { double sum = 0.0; for (const auto&amp; x : data) { sum += x * x; } return sum; } // Functional version double sum_squares_fp(const vector&lt;double&gt;&amp; data) { return fold(data, 0.0, [](double acc, double x) { return acc + x * x; }); } With -O3, GCC generates identical assembly for both. The functional version is actually safer—no loop variables, no bounds checking worries.
My New Toolkit Here&rsquo;s what functional thinking added to my C++ toolbox:
map/filter/reduce - The basics for working with collections Function composition - compose(f, g)(x) = f(g(x)) Currying - curry(f)(a)(b) = f(a, b) Lazy evaluation - Using generator or ranges::view Like currying for configuration:
auto create_server = curry([](int port, const string&amp; host, Config config) { return Server{port, host, config}; }); auto create_local_server = create_server(8080, &#34;localhost&#34;); auto server = create_local_server(config); The Mindset Shift Functional programming taught me something important: code is math, and the compiler is my proof assistant.
Before: I wrote loops thinking &ldquo;do this repeatedly&rdquo;. Now: I write fold thinking &ldquo;apply this associative operation&rdquo;.
Before: I wrote conditionals thinking &ldquo;if this, then that&rdquo;. Now: I write filter thinking &ldquo;select elements satisfying this predicate&rdquo;.
This mindset lets me write code that&rsquo;s easier to prove correct. Last week I found a bug and mentally traced it:
Given: filter(is_even, [1,2,3,4]) = [2,4] Given: map(square, [2,4]) = [4,16] Given: fold(add, 0, [4,16]) = 20 Therefore: sum of squares of even numbers = 20 Writing it down like that was the proof.
Functional C++ in the Real World This is how I write production code now:
// HTTP request processing pipeline auto handle_request = compose( validate_request, authenticate, parse_body&lt;Order&gt;, process_order, create_response ); // Or with ranges auto valid_orders = requests | views::filter(is_valid_order) | views::transform(parse_order) | views::filter([](const Order&amp; o) { return o.total &gt; 100.0; }) | views::transform(apply_discount) | ranges::to&lt;vector&gt;(); This isn&rsquo;t &ldquo;functional C++&quot;—it&rsquo;s just C++. But it&rsquo;s C++ written with functional thinking.
Finally When I started seeing loops through mathematical eyes, they stopped being loops and became instances of algebraic structures. That perspective lets me write code that&rsquo;s cleaner, more correct, and honestly more fun to write.
Maybe that&rsquo;s the end goal of programming: code stops being instructions and becomes executable mathematics.
`,url:"https://www.functor.me/posts/thought_fp/"},"https://www.functor.me/tags/color-theory/":{title:"Color-Theory",tags:[],content:"",url:"https://www.functor.me/tags/color-theory/"},"https://www.functor.me/tags/neovim/":{title:"Neovim",tags:[],content:"",url:"https://www.functor.me/tags/neovim/"},"https://www.functor.me/tags/oklab/":{title:"Oklab",tags:[],content:"",url:"https://www.functor.me/tags/oklab/"},"https://www.functor.me/posts/oklab_design/":{title:"Stop Guessing Hex Codes: A Better Way to Pick Theme Colors",tags:["neovim","oklab","color-theory"],content:`I&rsquo;ve probably made some different Neovim themes over the years. Each time I thought &ldquo;this is the one&rdquo; and each time, a month later, I&rsquo;d be tweaking colors again because something just felt&hellip; off.
The problem? I was doing what everyone does—picking colors by eye, converting between RGB and HSL, hoping the math would somehow make sense. Spoiler: it doesn&rsquo;t.
Then I found Oklab and everything got way easier.
RGB/HSL Are Kinda Broken for This Here&rsquo;s the thing: in RGB, changing red from 200 to 210 might look like a tiny shift, but changing blue from 200 to 210 could be a massive difference. HSL is better but still weird—adjusting saturation can make some colors way brighter and others barely change.
You end up with this:
-- Wait, which one is brighter? 🤷 local color1 = &#34;#c5895b&#34; local color2 = &#34;#a87d52&#34; No idea without actually looking at them. And if you want to make color1 &ldquo;just a bit dimmer&rdquo;? Good luck.
Enter Oklab: Colors That Actually Make Sense Oklab is a &ldquo;perceptually uniform&rdquo; color space. Translation: move a color 0.1 units and it looks 0.1 units different. Predictably.
It has three channels:
L (0-1): Brightness. 0 = black, 1 = white, simple. a (-0.4 to +0.4): Red ↔ Green b (-0.4 to +0.4): Yellow ↔ Blue Want an orange that&rsquo;s 68% bright? Easy:
oklab_to_srgb(0.68, 0.055, 0.065) -- L=0.68, slightly red, slightly yellow = orange Want it brighter? Change the first number:
oklab_to_srgb(0.72, 0.055, 0.065) -- Same hue, 4% brighter That&rsquo;s it. No guessing.
Implementation The conversion from Oklab to RGB goes through a few steps:
Step 1: Oklab → LMS (cone response) [lms]=[10.39630.21581−0.1056−0.06391−0.0895−1.2915][Lab] \\begin{bmatrix} l \\\\ m \\\\ s \\end{bmatrix} = \\begin{bmatrix} 1 &amp; 0.3963 &amp; 0.2158 \\\\ 1 &amp; -0.1056 &amp; -0.0639 \\\\ 1 &amp; -0.0895 &amp; -1.2915 \\end{bmatrix} \\begin{bmatrix} L \\\\ a \\\\ b \\end{bmatrix} ​lms​​=​111​0.3963−0.1056−0.0895​0.2158−0.0639−1.2915​​​Lab​​Step 2: Inverse cube root LMSlinear=[l3,m3,s3]T \\text{LMS}_{\\text{linear}} = [l^3, m^3, s^3]^T LMSlinear​=[l3,m3,s3]TStep 3: LMS → Linear RGB [RGB]=[4.0767−3.30770.2310−1.26842.6098−0.3413−0.0042−0.70341.7076][l3m3s3] \\begin{bmatrix} R \\\\ G \\\\ B \\end{bmatrix} = \\begin{bmatrix} 4.0767 &amp; -3.3077 &amp; 0.2310 \\\\ -1.2684 &amp; 2.6098 &amp; -0.3413 \\\\ -0.0042 &amp; -0.7034 &amp; 1.7076 \\end{bmatrix} \\begin{bmatrix} l^3 \\\\ m^3 \\\\ s^3 \\end{bmatrix} ​RGB​​=​4.0767−1.2684−0.0042​−3.30772.6098−0.7034​0.2310−0.34131.7076​​​l3m3s3​​Step 4: Gamma correction (sRGB) CsRGB={12.92×Clinearif Clinear≤0.00313081.055×Clinear1/2.4−0.055otherwise C_{\\text{sRGB}} = \\begin{cases} 12.92 \\times C_{\\text{linear}} &amp; \\text{if } C_{\\text{linear}} \\leq 0.0031308 \\\\ 1.055 \\times C_{\\text{linear}}^{1/2.4} - 0.055 &amp; \\text{otherwise} \\end{cases} CsRGB​={12.92×Clinear​1.055×Clinear1/2.4​−0.055​if Clinear​≤0.0031308otherwise​Here&rsquo;s the implementation:
local function oklab_to_linear_rgb(L, a, b) -- Transform Oklab to LMS (cone response) local l = L + 0.3963377774 * a + 0.2158037573 * b local m = L - 0.1055613458 * a - 0.0638541728 * b local s = L - 0.0894841775 * a - 1.2914855480 * b -- Apply inverse cube root local l3, m3, s3 = l * l * l, m * m * m, s * s * s -- LMS to linear RGB local r = 4.0767416621 * l3 - 3.3077115913 * m3 + 0.2309699292 * s3 local g = -1.2684380046 * l3 + 2.6097574011 * m3 - 0.3413193965 * s3 local b_out = -0.0041960863 * l3 - 0.7034186147 * m3 + 1.7076147010 * s3 return r, g, b_out end local function linear_to_srgb_component(c) if c &lt;= 0.0031308 then return c * 12.92 else return 1.055 * (c ^ (1 / 2.4)) - 0.055 end end local function oklab_to_srgb(L, a, b) local r, g, b_comp = oklab_to_linear_rgb(L, a, b) r = linear_to_srgb_component(r) g = linear_to_srgb_component(g) b_comp = linear_to_srgb_component(b_comp) -- Convert to 8-bit and clamp r = math.floor(math.max(0, math.min(1, r)) * 255 + 0.5) g = math.floor(math.max(0, math.min(1, g)) * 255 + 0.5) b_comp = math.floor(math.max(0, math.min(1, b_comp)) * 255 + 0.5) return string.format(&#39;#%02x%02x%02x&#39;, r, g, b_comp) end Those magic numbers come from the Oklab spec. Just copy-paste and it works.
Designing a Palette Here&rsquo;s how I actually use this. Instead of random hex codes, I think in terms of brightness and hue.
Background and foreground first:
local colors = {} -- Dark but not pure black (L=0.24, basically neutral) colors.bg = oklab_to_srgb(0.24, 0.001, 0.006) -- Bright text (L=0.74, also basically neutral) colors.fg = oklab_to_srgb(0.74, 0.0, 0.008) Then decide on a brightness hierarchy.
There are two common approaches:
Style 1: Structure-First
Brighten keywords, functions, types - emphasize code structure Dim data (strings, numbers) - they&rsquo;re secondary Example: structure at L=0.68, data at L=0.64 Style 2: Data-First (Tonsky&rsquo;s philosophy)
Dim keywords (low brightness + low saturation) - they&rsquo;re just syntactic noise Brighten function definitions, strings, numbers - that&rsquo;s your actual code Example: keywords at L=0.60, data at L=0.68-0.70 How to Pick a/b Values (Hue) Here&rsquo;s a quick reference for common colors in Oklab space:
-- Red: a &gt; 0, b near 0 or slightly positive oklab_to_srgb(L, 0.08, 0.04) -- orange-red oklab_to_srgb(L, 0.10, 0.02) -- pure red oklab_to_srgb(L, 0.10, -0.02) -- magenta-red -- Orange: a &gt; 0, b &gt; 0, roughly equal oklab_to_srgb(L, 0.055, 0.065) -- typical orange oklab_to_srgb(L, 0.05, 0.07) -- more yellow-orange -- Yellow: a ≈ 0, b &gt; 0 oklab_to_srgb(L, 0.02, 0.08) -- yellow-orange oklab_to_srgb(L, 0.0, 0.08) -- pure yellow oklab_to_srgb(L, -0.02, 0.08) -- yellow-green -- Green: a &lt; 0, b &gt; 0 oklab_to_srgb(L, -0.05, 0.06) -- typical green oklab_to_srgb(L, -0.08, 0.04) -- deeper green -- Cyan: a &lt; 0, b &lt; 0, |a| &gt; |b| oklab_to_srgb(L, -0.055, -0.01) -- cyan oklab_to_srgb(L, -0.06, -0.03) -- more blue-cyan -- Blue: a &lt; 0, b &lt; 0, |b| &gt; |a| oklab_to_srgb(L, -0.02, -0.06) -- typical blue oklab_to_srgb(L, -0.01, -0.08) -- deeper blue -- Violet/Purple: a &gt; 0, b &lt; 0 oklab_to_srgb(L, 0.05, -0.04) -- violet oklab_to_srgb(L, 0.08, -0.06) -- purple Saturation control: saturation=a2+b2\\text{saturation} = \\sqrt{a^2 + b^2}saturation=a2+b2​
s &lt; 0.05: very muted, almost gray s ≈ 0.08: moderate, comfortable for long sessions s &gt; 0.10: vivid, can be fatiguing So if you want a &ldquo;medium orange at 68% brightness with moderate saturation around 0.08&rdquo;:
-- Start with the hue ratio you want (orange ≈ equal a and b) -- Then scale to get saturation ≈ 0.08 local orange = oklab_to_srgb(0.68, 0.055, 0.065) -- sqrt(0.055² + 0.065²) ≈ 0.085 Blending Colors Sometimes you need a subtle background color—like for diagnostic messages. You want it to be related to the error color but way more subtle.
Here&rsquo;s my blend function:
local function hex_to_rgb(hex) hex = hex:gsub(&#39;#&#39;, &#39;&#39;) return { tonumber(hex:sub(1, 2), 16), tonumber(hex:sub(3, 4), 16), tonumber(hex:sub(5, 6), 16), } end local function rgb_to_hex(c) return string.format(&#39;#%02x%02x%02x&#39;, c[1], c[2], c[3]) end local function blend(fg, bg, t) local a, b = hex_to_rgb(fg), hex_to_rgb(bg) local c = { math.floor(a[1] * (1 - t) + b[1] * t + 0.5), math.floor(a[2] * (1 - t) + b[2] * t + 0.5), math.floor(a[3] * (1 - t) + b[3] * t + 0.5), } return rgb_to_hex(c) end Use it like this:
local red = oklab_to_srgb(0.66, 0.08, 0.04) local bg = oklab_to_srgb(0.24, 0.001, 0.006) -- Red error text on a very subtle reddish background vim.api.nvim_set_hl(0, &#39;DiagnosticVirtualTextError&#39;, { fg = red, bg = blend(red, bg, 0.65) -- 65% background, 35% red }) The t parameter controls the mix. 0.0 = pure foreground color, 1.0 = pure background, 0.65 = mostly background with a hint of the foreground.
This is way better than manually picking a &ldquo;light red&rdquo; background that might not even match.
Putting It Together Just some quick examples of how to use this:
-- Background and foreground local bg = oklab_to_srgb(0.24, 0.001, 0.006) local fg = oklab_to_srgb(0.74, 0.0, 0.008) -- Make a few colors local orange = oklab_to_srgb(0.68, 0.055, 0.065) local blue = oklab_to_srgb(0.68, -0.02, -0.06) local green = oklab_to_srgb(0.64, -0.05, 0.06) local red = oklab_to_srgb(0.66, 0.08, 0.04) -- Use them vim.api.nvim_set_hl(0, &#39;Normal&#39;, { fg = fg, bg = bg }) vim.api.nvim_set_hl(0, &#39;Keyword&#39;, { fg = orange }) vim.api.nvim_set_hl(0, &#39;Function&#39;, { fg = blue }) vim.api.nvim_set_hl(0, &#39;String&#39;, { fg = green }) vim.api.nvim_set_hl(0, &#39;DiagnosticError&#39;, { fg = red }) -- Blend for subtle backgrounds vim.api.nvim_set_hl(0, &#39;DiagnosticVirtualTextError&#39;, { bg = blend(red, bg, 0.65) }) That&rsquo;s pretty much it. Pick some L values, tweak the a/b until it looks right, done.
Why This Actually Helps Before Oklab:
&ldquo;This orange looks too bright&hellip; let me try #c58960&hellip; no wait #b87a55&hellip; hmm maybe #ca8e62?&rdquo; One hour later, still tweaking After Oklab:
&ldquo;Too bright? Change L from 0.68 to 0.65&rdquo; Done in 30 seconds The real win is systematic adjustments:
Make everything 5% brighter? Add 0.05 to all L values Reduce saturation? Scale down all a/b values by 20% Switch from data-first to structure-first? Just swap the L values You&rsquo;re not guessing anymore. You&rsquo;re tuning a system.
Some Practical Tips Testing colors quickly:
local test = oklab_to_srgb(0.68, 0.055, 0.065) print(test) -- prints: #c5895b Adjusting systematically:
-- Make everything 5% brighter colors.orange = oklab_to_srgb(0.73, 0.055, 0.065) -- was 0.68 -- Reduce saturation by 20% colors.orange = oklab_to_srgb(0.68, 0.044, 0.052) -- was (0.055, 0.065) -- Warm up the whole palette colors.orange = oklab_to_srgb(0.68, 0.055, 0.075) -- increase b value When not to use Oklab: If you&rsquo;re trying to match an existing hex code exactly, just use the hex. Oklab is for designing colors, not copying them.
References Oklab spec: https://bottosson.github.io/posts/oklab/ (this is where all those magic numbers come from) That&rsquo;s it. No need to make this more complicated than it is. Pick some L values for brightness, tweak a/b until the hues look right, and you&rsquo;re done.
